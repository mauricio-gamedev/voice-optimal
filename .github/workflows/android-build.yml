name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.CLEARMIC_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ClearMic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode permanent update keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          CLEARMIC_KEYSTORE_BASE64: ${{ secrets.CLEARMIC_KEYSTORE_BASE64 }}
        run: echo "$CLEARMIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clearmic-update.jks"

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          CLEARMIC_KEYSTORE_PATH: ${{ runner.temp }}/clearmic-update.jks
          CLEARMIC_KEYSTORE_PASSWORD: ${{ secrets.CLEARMIC_KEYSTORE_PASSWORD }}
          CLEARMIC_KEY_ALIAS: ${{ secrets.CLEARMIC_KEY_ALIAS }}
          CLEARMIC_KEY_PASSWORD: ${{ secrets.CLEARMIC_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ClearMic-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
